<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>관리자 | 뫔건강연구소</title>
<link rel="icon" href="assets/images/favicon-v4.png">
<link rel="preload" href="assets/fonts/KakaoSmallSans-Regular.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gothic+A1:wght@900&display=swap&text=%EB%AB%94%EA%B1%B4%EA%B0%95%EC%97%B0%EA%B5%AC%EC%86%8C">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body data-page="admin">
<div id="site-header"></div>
<main id="main">
<section class="page-hero only-eyebrow news-top"><div class="wrap">
<p class="eyebrow">ADMIN</p>
<h1 class="ko-title">관리자</h1>
</div></section>

<section class="section"><div class="wrap">
  <form class="lock" id="lock" autocomplete="off">
    <label for="pw">비밀번호</label>
    <div class="lock-row">
      <input type="password" id="pw" required>
      <button type="submit" class="btn-line">열기</button>
    </div>
    <p class="lock-msg" id="msg" aria-live="polite"></p>
  </form>
  <div id="album" hidden></div>
</div></section>
</main>
<div class="viewer" id="viewer" hidden><img alt=""><button type="button" aria-label="닫기">×</button></div>
<div id="site-footer"></div>
<script src="assets/data/site.js"></script>
<script src="assets/js/layout.js"></script>
<script>
/* 사진과 목록은 앨범_암호화.py 로 AES-GCM 암호화되어 album/ 에 있음.
   비밀번호로 열쇠를 만들어(PBKDF2) 브라우저 안에서만 풀어 보여 줌. 비밀번호는 어디에도 저장·전송되지 않음 */
(function () {
  var form = document.getElementById('lock'), msg = document.getElementById('msg');
  var box = document.getElementById('album'), viewer = document.getElementById('viewer');
  var key = null, KEEP = 'mwam-album-key';

  function b64(s) { return Uint8Array.from(atob(s), function (c) { return c.charCodeAt(0); }); }
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }

  async function load(name) {
    var r = await fetch('album/' + name, { cache: 'no-store' });
    if (!r.ok) throw new Error('nofile');
    return new Uint8Array(await r.arrayBuffer());
  }
  async function open(bytes) {
    return crypto.subtle.decrypt({ name: 'AES-GCM', iv: bytes.slice(0, 12) }, key, bytes.slice(12));
  }
  async function derive(pw) {
    var mr = await fetch('album/meta.json', { cache: 'no-store' });
    if (!mr.ok) throw new Error('nofile');
    var meta = await mr.json();
    var base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
    return crypto.subtle.deriveKey({ name: 'PBKDF2', salt: b64(meta.salt), iterations: meta.iter, hash: 'SHA-256' },
      base, { name: 'AES-GCM', length: 256 }, true, ['decrypt']);
  }

  async function show() {
    var data = JSON.parse(new TextDecoder().decode(await open(await load('manifest.bin'))));
    form.hidden = true; box.hidden = false;
    if (!data.albums.length) { box.innerHTML = '<p class="empty">아직 사진이 없습니다.</p>'; return; }
    box.innerHTML = data.albums.map(function (a) {
      return '<section class="alb"><h2>' + esc(a.title) + '</h2><div class="alb-grid">' +
        a.photos.map(function (p) {
          return '<button type="button" class="alb-ph" data-id="' + esc(p.id) + '" style="aspect-ratio:' + p.w + '/' + p.h + '"></button>';
        }).join('') + '</div></section>';
    }).join('') + '<p class="to-list"><button type="button" class="btn-line" id="logout">잠그기</button></p>';
    document.getElementById('logout').onclick = function () {
      try { sessionStorage.removeItem(KEEP); } catch (e) {}
      location.reload();
    };
    // 사진을 차례로 풀기 (동시에 4장씩)
    var list = Array.prototype.slice.call(box.querySelectorAll('.alb-ph'));
    list.forEach(function (b) {
      b.onclick = function () {
        if (!b.dataset.url) return;
        viewer.querySelector('img').src = b.dataset.url;
        viewer.hidden = false;
      };
    });
    var next = 0;
    function work() {
      var b = list[next++];
      if (!b) return;
      return load(b.dataset.id + '.bin').then(open).then(function (buf) {
        var url = URL.createObjectURL(new Blob([buf], { type: 'image/jpeg' }));
        b.innerHTML = '<img src="' + url + '" alt="">';
        b.dataset.url = url;
      }).catch(function () { b.classList.add('err'); }).then(work);
    }
    for (var i = 0; i < 4; i++) work();
  }

  viewer.onclick = function () { viewer.hidden = true; };
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') viewer.hidden = true; });

  form.onsubmit = async function (e) {
    e.preventDefault();
    msg.textContent = '여는 중…';
    try {
      key = await derive(document.getElementById('pw').value);
      await show();
      try { sessionStorage.setItem(KEEP, JSON.stringify(Array.from(new Uint8Array(await crypto.subtle.exportKey('raw', key))))); } catch (e2) {}
    } catch (err) {
      key = null;
      msg.textContent = err.message === 'nofile' ? '아직 앨범이 만들어지지 않았습니다.' : '비밀번호가 맞지 않습니다.';
    }
  };

  // 같은 탭에서 다시 들어오면 비밀번호 없이 열기 (탭을 닫으면 사라짐)
  (async function () {
    try {
      var raw = sessionStorage.getItem(KEEP);
      if (!raw) return;
      key = await crypto.subtle.importKey('raw', new Uint8Array(JSON.parse(raw)), 'AES-GCM', true, ['decrypt']);
      await show();
    } catch (e) { key = null; }
  })();
})();
</script>
</body>
</html>
